<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
</head>
<body>
    <header>
        <h1>Todo-List</h1>
    </header>
    <main>
        <div class="sidebar">
            <button class="all active">All projects</button>
            <div class="projects">

            </div>
            <button class="Add-project ">+  Add Project</button>
            <form class="closed add-project-form" >
                <label for="project-name">Name</label>
                <input minlength="3" required id="project-name" type="text">
                <div class="form-buttons">
                <button type="button" formnovalidate class="cancel-project">Cancel</button>
                <button type="" class="confirm-add">+ Add</button>
                </div>
            </form>
        </div>
        <div class="main-content">
            <div class="todo-container">
                <div class="todos">
                    <div class="todo low">
                        <h4>Name</h4>
                        
                        <p class="due-date">29/09/2026</p>
                    </div>
                </div>
            <button class="add-todo">+ new todo</button>
            <form action="" class="closed new-todo">
                <div class="new-todo-inputs">
                <label for="todo-name">Name</label>
                <input id="todo-name" type="text">
                <label for="todo-date">data-due</label>
                <input id="todo-date" type="date">
                <label for="select-project">Select project
                    <select name="project" id="select-project">
                    </select>
                </label>
                <label for="select-priority">
                    <select name="priority" id="select-priority">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </label>
                </div>
                <div class="new-todo-form-buttons">
                <button type="button" class="push-todo">Save</button>
                <button type="button" class="cancel-todo" >Cancel</button>
                </div>
            </form>
            </div>
        </div>
        <div class="todo-details-display closed">
            <div class="form-container">
                <div class="project-name">
                    <h4 class="todo-details-project-name" >
                        <img height="15" src="./images/icon-wrapper.svg" alt="">
                        <span class="todo-details-name"></span>
                    </h4>
                    <p class="priority" >
                        <span class="internal-priority">High </span>
                        Priority
                    </p>
                </div>
                <div class="todo-title">
                    <h3>wait how did you found me ? </h3>
                </div>
                <div class="due-date-container">
                    <h3>Due Date</h3>
                    <div class="due-date">
                        <img src="./images/icon-wrapper (1).svg" alt="">
                        <input class="due-date-input" type="date">
                    </div>
                </div>
                <div class="description-container">
                    <h4>Description</h4>
                    <textarea class="description"></textarea>
                </div>
                <div class="sub-tasks-container">
                    <h4>Sub-Tasks</h4>
                    <div class="sub-tasks">
                        <div class="subtask">

                        </div>
                    </div>
                    <button class="add-sub-task">+ Add sub-task</button>
                    <div class="new-sub-task closed">
                        <label for="new-sub-task-input">Name:</label>
                        <input type="text" id="new-sub-task-input">
                        <div class="buttons">
                            <button class="add-subclass">Add</button>
                            <button class="cancel-subclass">Cancel</button>
                        </div>
                    </div>
                    <div class="todo-details-controls">
                        <div class="delete-mark-complete">
                            <button type="button" class="delete-todo">
                                Delete
                            </button>
                            <button type="button" class="mark-complete complete"><img src="./images/Vector.svg" alt=""> Mark <span class="complete-uncomplete-todo"></span></button>
                        </div>
                        <div class="cancel-save">
                            <button type="button" class="cancel-button">Cancel</button>
                            <button type="button" class="save-button">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p class="footer-content">
            Copyright © 2026 S7S-37  <a href="https://github.com/S7S37"><img height="20" src="./images/GitHub_Invertocat_White.svg" alt=""></a>
        </p>
    </footer>
</body>
</html>
